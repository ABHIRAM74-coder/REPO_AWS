
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family File Portal</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <div class="logo">☁</div>
            <h1>Family File Portal</h1>
            <p class="subtitle">Securely access your files</p>

            <!-- LOGIN -->
            <form id="loginForm">
                <h2>Login</h2>

                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail"
                       autocomplete="username" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       autocomplete="current-password" required>

                <button type="submit">Login</button>

                <p>Don't have an account?
                    <a href="#" id="showSignup">Sign Up</a>
                </p>
            </form>

            <!-- SIGN UP -->
            <form id="signupForm" hidden>
                <h2>Create Account</h2>

                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail"
                       autocomplete="email" required>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword"
                       autocomplete="new-password"
                       minlength="8" required>

                <button type="submit">Sign Up</button>

                <p>Already have an account?
                    <a href="#" id="showLogin">Login</a>
                </p>
            </form>

            <!-- EMAIL VERIFICATION -->
            <form id="verifyForm" hidden>
                <h2>Verify Email</h2>
                <p>Enter the code sent to your email.</p>

                <label for="verifyCode">Verification Code</label>
                <input type="text" id="verifyCode"
                       autocomplete="one-time-code" required>

                <button type="submit">Verify Email</button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <!-- AUTHENTICATED VIEW -->
            <section id="accountSection" hidden>
                <h2>Login Successful!</h2>
                <p>You are authenticated with AWS Cognito.</p>
                <button id="logoutBtn" type="button">Logout</button>
            </section>

            <p class="footer-text">
                Secure file storage powered by AWS
            </p>
        </div>
    </main>

    <script type="module" src="/script.js"></script>
</body>
</html>
